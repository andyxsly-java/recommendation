databaseChangeLog:
  - changeSet:
      id: 002-create-rule-statistic-table
      author: andyxsly

      changes:
        - createTable:
            tableName: rule_statistic

            columns:
              - column:
                  name: rule_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: count
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rule_statistic
            baseColumnNames: rule_id

            referencedTableName: recommendation_rule
            referencedColumnNames: id

            constraintName: fk_rule_statistic_rule

            onDelete: CASCADE