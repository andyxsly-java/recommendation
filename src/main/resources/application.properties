spring.application.name=recommendation

application.recommendations-db.url=jdbc:h2:file:./transaction;ACCESS_MODE_DATA=r

recommendation.datasource.url=jdbc:postgresql://localhost:5432/recommendation_db
recommendation.datasource.username=
recommendation.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.liquibase.change-log=classpath:/db/changelog-master.yaml

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=false